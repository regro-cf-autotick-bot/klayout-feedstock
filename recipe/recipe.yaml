schema_version: 1

context:
  version: "0.30.14-1"

package:
  name: klayout
  version: ${{ version }}

source:
  url: https://github.com/KLayout/klayout/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 98bebc1a6595e92bdf5fdc1ae7fa3c61f8141467fd9dba2db3acb01bcce59319

build:
  number: 0
  skip:
    # osx is not yet supported
    - osx
  script:
    file: ${{ "build_klayout.bat" if win else "build_klayout.sh" }}

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - if: unix
      then:
        - make
    - if: win
      then:
        - jom
  host:
    - python
    # On Linux, Python 3.15 ships the shared library in a separate package.
    - if: linux and match(python, ">=3.15")
      then: libpython
    - qt6-main
    - qt6-multimedia
    - if: linux
      then:
        - libgl-devel
        - libopengl-devel
    - libpng
    - libcurl
    - expat
    - zlib
    - libgit2
  run:
    - python

tests:
  - python:
      imports:
        - klayout
        - klayout.db
        - klayout.lay
        - klayout.tl
        - klayout.rdb
        - klayout.pex
        - klayout.lib
        - klayout.pya
  - script:
      - if: unix
        then:
          - export QT_QPA_PLATFORM=offscreen
          - klayout -v
      - if: win
        then:
          - set QT_QPA_PLATFORM=offscreen
          - call klayout -v
      - python -c "import klayout.db as db; assert db.__version__ == '${{ version }}', db.__version__; print('klayout.db version OK', db.__version__)"
      - python -c "import klayout.db as db; ly = db.Layout(); ly.dbu = 0.001; top = ly.create_cell('TOP'); layer = ly.layer(1, 0); top.shapes(layer).insert(db.Box(0, 0, 1000, 2000)); ly.write('roundtrip.gds'); ly2 = db.Layout(); ly2.read('roundtrip.gds'); assert ly2.top_cell().name == 'TOP'; print('GDS roundtrip OK')"
      - if: unix
        then:
          - strm2oas roundtrip.gds roundtrip.oas
      - if: win
        then:
          - call strm2oas roundtrip.gds roundtrip.oas
      - python -c "import klayout.db as db; ly = db.Layout(); ly.read('roundtrip.oas'); assert ly.top_cell().name == 'TOP'; print('OASIS via strm2oas OK')"
      - if: unix
        then:
          - echo "import pathlib, pya; p = pya.Application.instance().inst_path(); print(p); assert pathlib.Path(p).as_posix().endswith('lib/klayout'), p" > inst_path.py
          - klayout -b -r inst_path.py
      - if: win
        then:
          - echo import pathlib, pya; p = pya.Application.instance().inst_path(); print(p); assert pathlib.Path(p).as_posix().endswith('lib/klayout'), p > inst_path.py
          - call klayout -b -r inst_path.py

about:
  homepage: https://www.klayout.de/
  repository: https://github.com/KLayout/klayout
  documentation: https://github.com/KLayout/klayout/wiki
  summary: KLayout layout viewer and editor with Python bindings
  description: |
    KLayout is an open-source layout viewer and editor for semiconductor
    designs. This package provides the full application and the Python
    bindings built from the KLayout sources with Qt6:

    - klayout: GUI application and command-line tool (batch mode -b)
    - buddy tools: strm2gds, strm2oas, strm2txt, strmclip, strmxor, strmrun, ...
    - Python module: klayout.db, klayout.lay, klayout.tl, klayout.rdb,
      klayout.pex, klayout.lib, klayout.pya (with Qt bindings)

    Use `klayout -b` for batch processing or `import klayout.db as db`
    in Python scripts.
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Xkhanh720
    - duyhieubui
